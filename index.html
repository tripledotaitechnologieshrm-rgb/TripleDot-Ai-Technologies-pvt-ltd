<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0f1d" />
    <meta property="og:site_name" content="TripleDot AI Technologies" />
    <meta property="og:title" content="TripleDot AI Technologies" />
    <meta property="og:description" content="Real skills. Real projects. Real careers." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>TripleDot AI Technologies</title>
    <script>
      // Dark is the default; switch to light before first paint if the visitor chose it.
      try {
        if (localStorage.getItem('theme') === 'light') {
          delete document.documentElement.dataset.theme
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#ffffff')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
